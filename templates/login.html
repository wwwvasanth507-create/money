<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AURA GAMING</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="glass-card" style="width: 100%; max-width: 420px; text-align: center;">
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      AURA GAMING
    </h1>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Real-Money Provably Fair Platform</p>

    <div id="errorAlert" style="display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.85rem;"></div>

    <form id="loginForm">
      <div class="form-group" style="text-align: left;">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" required>
      </div>

      <div class="form-group" style="text-align: left;">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>

    <p style="margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Don't have an account? <a href="/register" style="color: var(--accent-cyan);">Create Player Account</a>
    </p>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errorAlert');
      errEl.style.display = 'none';

      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      try {
        const res = await apiRequest('/auth/login/json', {
          method: 'POST',
          body: JSON.stringify({ username: u, password: p })
        });

        setAuthToken(res.access_token, res.role, res.username);
        if (res.role === 'PAYMENT_VERIFIER') {
          window.location.href = '/admin/verification-desk';
        } else if (res.role === 'ADMIN' || res.role === 'SUPER_ADMIN') {
          window.location.href = '/admin/dashboard';
        } else {
          window.location.href = '/dashboard';
        }
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
