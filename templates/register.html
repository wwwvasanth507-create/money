<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — AURA GAMING</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="glass-card" style="width: 100%; max-width: 440px; text-align: center;">
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      Create Player Account
    </h1>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Join AURA GAMING Provably Fair Platform</p>

    <div id="errorAlert" style="display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.85rem;"></div>

    <form id="registerForm">
      <div class="form-group" style="text-align: left;">
        <label for="regUsername">Username</label>
        <input type="text" id="regUsername" class="form-control" placeholder="Choose a username" required>
      </div>

      <div class="form-group" style="text-align: left;">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" class="form-control" placeholder="player@domain.com" required>
      </div>

      <div class="form-group" style="text-align: left;">
        <label for="regMobile">Mobile Number (Mandatory)</label>
        <input type="tel" id="regMobile" class="form-control" placeholder="10-digit mobile number (e.g. 9876543210)" required pattern="[0-9]{10}">
      </div>

      <div class="form-group" style="text-align: left;">
        <label for="regAadhaar">Aadhaar Card Number (Mandatory)</label>
        <input type="text" id="regAadhaar" class="form-control" placeholder="12-digit Aadhaar number (e.g. 123456789012)" required pattern="[0-9]{12}">
      </div>

      <div class="form-group" style="text-align: left;">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="Strong password" required minlength="8">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
    </form>

    <p style="margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Already registered? <a href="/login" style="color: var(--accent-cyan);">Sign In</a>
    </p>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errorAlert');
      errEl.style.display = 'none';

      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const mobile_number = document.getElementById('regMobile').value.trim();
      const aadhaar_number = document.getElementById('regAadhaar').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ username, email, mobile_number, aadhaar_number, password })
        });

        alert('Registration successful! Please log in with your credentials.');
        window.location.href = '/login';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
